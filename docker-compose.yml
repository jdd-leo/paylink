services:
  postgres:
    image: postgres:16-alpine
    container_name: paylink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paylink
      POSTGRES_PASSWORD: paylink
      POSTGRES_DB: paylink
    ports:
      - "5435:5432"
    volumes:
      - paylink-pgdata:/var/lib/postgresql/data

volumes:
  paylink-pgdata:
